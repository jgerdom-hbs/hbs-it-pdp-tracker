<title>FY27 Training &amp; Professional Development</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  /* Layout: one centered column; a vertical quarter trail with checklists. */
  :root{
    --bg:#faf9f5; --bg-card:#ffffff; --border:#e8e6dc; --border-strong:#b0aea5;
    --text:#141413; --text-muted:#6b6a63;
    --orange:#d97757; --green:#788c5d; --blue:#6a9bcc; --danger:#b5483b;
    --c0-bg:#e8f0f8; --c0-fg:#4f7fae;
    --c1-bg:#f5ddd0; --c1-fg:#c05f3f;
    --c2-bg:#eceae4; --c2-fg:#6b6a63;
    --c3-bg:#eef1e9; --c3-fg:#5f7346;
    --c4-bg:#efe6f3; --c4-fg:#7d5a8c;
    --c5-bg:#f6efd6; --c5-fg:#8a6d1f;
    --c6-bg:#e2f1ef; --c6-fg:#3e7a72;
    --c7-bg:#f6e3e7; --c7-fg:#a04a5c;
    --radius:10px;
    --font-ui:'Poppins',Arial,sans-serif;
    --font-body:'Lora',Georgia,serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1c1b19; --bg-card:#262522; --border:#3a3833; --border-strong:#5c5a53;
      --text:#f0eee6; --text-muted:#a8a69c;
      --orange:#e08a6c; --green:#93a877; --blue:#8bb3dc; --danger:#e07a6d;
      --c0-bg:#24313f; --c0-fg:#9cc0e6; --c1-bg:#3d2a21; --c1-fg:#eaa184;
      --c2-bg:#33312c; --c2-fg:#c2bfb4; --c3-bg:#2b3324; --c3-fg:#adc191;
      --c4-bg:#352a3b; --c4-fg:#c9a6d8; --c5-bg:#38321d; --c5-fg:#d9bf6e;
      --c6-bg:#1f3532; --c6-fg:#8ccbc2; --c7-bg:#3b252b; --c7-fg:#e39aaa;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1c1b19; --bg-card:#262522; --border:#3a3833; --border-strong:#5c5a53;
    --text:#f0eee6; --text-muted:#a8a69c;
    --orange:#e08a6c; --green:#93a877; --blue:#8bb3dc; --danger:#e07a6d;
    --c0-bg:#24313f; --c0-fg:#9cc0e6; --c1-bg:#3d2a21; --c1-fg:#eaa184;
    --c2-bg:#33312c; --c2-fg:#c2bfb4; --c3-bg:#2b3324; --c3-fg:#adc191;
    --c4-bg:#352a3b; --c4-fg:#c9a6d8; --c5-bg:#38321d; --c5-fg:#d9bf6e;
    --c6-bg:#1f3532; --c6-fg:#8ccbc2; --c7-bg:#3b252b; --c7-fg:#e39aaa;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--font-body); line-height:1.55;
    padding-inline:16px; padding-block:40px 80px;
  }
  .page{max-width:780px;margin:0 auto;}
  button,input,select{font-family:var(--font-ui);}
  :focus-visible{outline:2px solid var(--orange);outline-offset:2px;}

  header{margin-bottom:26px;}
  .eyebrow{font-family:var(--font-ui);font-size:12px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--orange);margin-bottom:10px;}
  h1{font-family:var(--font-ui);font-weight:600;font-size:clamp(26px,5vw,36px);margin:0 0 10px;letter-spacing:-0.01em;text-wrap:balance;}
  .subtitle{color:var(--text-muted);font-size:15px;max-width:68ch;margin:0;}

  .summary{display:flex;align-items:center;gap:20px;margin-top:26px;padding:18px 20px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);}
  .ring{width:60px;height:60px;border-radius:50%;flex-shrink:0;background:conic-gradient(var(--orange) calc(var(--pct,0)*1%), var(--border) 0);display:flex;align-items:center;justify-content:center;transition:background 0.4s ease;}
  .ring-inner{width:46px;height:46px;border-radius:50%;background:var(--bg-card);display:flex;align-items:center;justify-content:center;font-family:var(--font-ui);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;}
  .summary-text{min-width:0;}
  .summary-text .count{font-family:var(--font-ui);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;}
  #status{font-family:var(--font-ui);font-size:13px;color:var(--text-muted);}
  #status[data-kind="error"]{color:var(--danger);}

  .toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;font-family:var(--font-ui);font-size:12.5px;color:var(--text-muted);}
  .toolbar .left{display:flex;align-items:center;gap:10px;}
  select,input[type=text],input[type=url]{font-size:12.5px;color:var(--text);background:var(--bg-card);border:1px solid var(--border-strong);border-radius:6px;padding:6px 10px;}
  select{cursor:pointer;}
  .btn{background:none;border:1px solid var(--border-strong);color:var(--text-muted);padding:7px 14px;border-radius:6px;font-size:12px;cursor:pointer;}
  .btn:hover{border-color:var(--orange);color:var(--orange);}
  .btn.primary{background:var(--orange);border-color:var(--orange);color:var(--bg-card);}
  .btn.primary:hover{opacity:0.9;color:var(--bg-card);}
  .btn.danger{border-color:var(--danger);color:var(--danger);}
  .btn[disabled]{opacity:0.5;cursor:not-allowed;}

  .trail{margin-top:32px;}
  .empty{padding:24px;border:1px dashed var(--border-strong);border-radius:var(--radius);color:var(--text-muted);font-family:var(--font-ui);font-size:14px;text-align:center;}
  .phase{display:flex;gap:20px;}
  .marker-col{display:flex;flex-direction:column;align-items:center;width:38px;flex-shrink:0;}
  .node{width:38px;height:38px;border-radius:50%;background:conic-gradient(var(--node-color, var(--orange)) calc(var(--node-pct,0)*1%), var(--border) 0);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.4s ease;}
  .node-inner{width:30px;height:30px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--font-ui);font-size:11px;font-weight:600;color:var(--text-muted);}
  .connector{width:2px;flex:1;background:var(--border);margin:4px 0;min-height:20px;transition:background 0.4s ease;}
  .connector.filled{background:var(--orange);}
  .phase:last-child .connector{display:none;}
  .phase-body{flex:1;min-width:0;padding-bottom:34px;}
  .phase-tag{font-family:var(--font-ui);font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px;}
  .phase-title{font-family:var(--font-ui);font-size:19px;font-weight:600;margin:0 0 12px;}

  .checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .item{display:flex;align-items:flex-start;gap:10px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:11px 14px;transition:border-color 0.2s ease;}
  .item.checked{border-color:var(--green);}
  .item input[type=checkbox]{appearance:none;width:18px;height:18px;border:1.5px solid var(--border-strong);border-radius:5px;flex-shrink:0;margin-top:1px;cursor:pointer;position:relative;background:var(--bg-card);}
  .item input[type=checkbox]:checked{background:var(--green);border-color:var(--green);}
  .item input[type=checkbox]:checked::after{content:'';position:absolute;left:5px;top:1px;width:5px;height:9px;border:solid var(--bg-card);border-width:0 2px 2px 0;transform:rotate(45deg);}
  .item-text{font-size:14px;flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px;overflow-wrap:anywhere;}
  .item.checked .item-title{color:var(--text-muted);text-decoration:line-through;text-decoration-color:var(--border-strong);}
  .item-text a{color:var(--text);text-decoration:underline;text-decoration-color:var(--border-strong);}
  .item-text a:hover{color:var(--orange);}
  .tag{display:inline-block;font-family:var(--font-ui);font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;letter-spacing:0.02em;}
  .item-tools{display:flex;flex-wrap:wrap;gap:4px;flex-shrink:0;}
  .icon-btn{background:none;border:1px solid var(--border);color:var(--text-muted);border-radius:5px;font-size:11px;padding:3px 8px;cursor:pointer;}
  .icon-btn:hover{border-color:var(--orange);color:var(--orange);}
  .icon-btn[disabled]{opacity:0.35;cursor:default;}
  .icon-btn[disabled]:hover{border-color:var(--border);color:var(--text-muted);}
  .icon-btn.danger:hover{border-color:var(--danger);color:var(--danger);}
  .add-row{margin-top:8px;}

  .edit-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--bg-card);border:1px solid var(--orange);border-radius:8px;padding:14px;font-family:var(--font-ui);font-size:12px;color:var(--text-muted);}
  .edit-form label{display:flex;flex-direction:column;gap:4px;min-width:0;}
  .edit-form .full{grid-column:1 / -1;}
  .edit-form input,.edit-form select{width:100%;font-size:13px;}
  .edit-form .actions{grid-column:1 / -1;display:flex;gap:8px;justify-content:flex-end;}
  .edit-form .err{grid-column:1 / -1;color:var(--danger);}
  @media (max-width:520px){ .edit-form{grid-template-columns:1fr;} .item{flex-wrap:wrap;} .item-tools{width:100%;padding-left:28px;} }

  footer{margin-top:26px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--text-muted);font-family:var(--font-ui);}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>

<div class="page">
  <header>
    <div class="eyebrow">FY27 · Personal reference</div>
    <h1>Training &amp; Professional Development</h1>
    <p class="subtitle">Every training commitment for the year, in one place, organized by quarter.</p>

    <div class="summary">
      <div class="ring" id="ring"><div class="ring-inner"><span id="pct-label">0%</span></div></div>
      <div class="summary-text">
        <div class="count"><span id="done-count">0</span> / <span id="total-count">0</span> items complete</div>
        <div id="status" data-kind="starting" role="status">Loading your plan</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="left">
        <label for="pill-filter">Show:</label>
        <select id="pill-filter"><option value="all">All</option></select>
      </div>
      <button class="btn" id="edit-toggle" type="button">Edit list</button>
    </div>
  </header>

  <div class="trail" id="trail">
    <div class="empty">Loading your plan.</div>
  </div>

  <footer>
    <span id="footer-path">FY27</span>
    <button class="btn" id="reset-btn" type="button">Reset progress</button>
  </footer>
</div>

<script>
/* ---------- data ---------- */
const LOCAL_KEY = 'fy27-pdp-tracker';
const DOC_PATH = 'plans/fy27';
const DEFAULT_QUARTERS = [
  {key:'Q1', label:'Jul – Sep 2026'},
  {key:'Q2', label:'Oct – Dec 2026'},
  {key:'Q3', label:'Jan – Mar 2027'},
  {key:'Q4', label:'Apr – Jun 2027'}
];
const SLOTS = 8;
let state = { quarters: DEFAULT_QUARTERS, categories: [], items: [], updated: null };
let loaded = false;
let editMode = false;
let editingId = null;      // item id being edited, or 'new:Q2' for an add form
let confirmDeleteId = null;
let canWrite = true;
let filterVal = 'all';

const $ = id => document.getElementById(id);
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids) if (k != null) n.append(k);
  return n;
}
function newId(){ return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function normalize(d){
  const out = { quarters: DEFAULT_QUARTERS, categories: [], items: [], updated: null };
  if (!d || typeof d !== 'object') return out;
  if (Array.isArray(d.quarters) && d.quarters.length) out.quarters = d.quarters.filter(q => q && q.key).map(q => ({key:String(q.key), label:String(q.label||'')}));
  if (Array.isArray(d.categories)) out.categories = d.categories.filter(c => c && c.name).map(c => ({name:String(c.name), slot:Number(c.slot)||0}));
  if (Array.isArray(d.items)) out.items = d.items.filter(i => i && i.id && i.title).map(i => ({
    id:String(i.id), quarter:String(i.quarter||out.quarters[0].key), title:String(i.title),
    category:String(i.category||''), url:String(i.url||''), done:!!i.done
  }));
  out.updated = d.updated || null;
  return out;
}
function catSlot(name){
  const c = state.categories.find(c => c.name === name);
  return c ? c.slot % SLOTS : 2;
}
function ensureCategory(name){
  if (!name || state.categories.some(c => c.name === name)) return;
  const used = new Set(state.categories.map(c => c.slot % SLOTS));
  let slot = 0; while (used.has(slot) && slot < SLOTS - 1) slot++;
  if (used.has(slot)) slot = state.categories.length % SLOTS;
  state.categories.push({name, slot});
}
function pruneCategories(){
  const inUse = new Set(state.items.map(i => i.category));
  state.categories = state.categories.filter(c => inUse.has(c.name));
}
function safeUrl(u){
  try { const p = new URL(u); return (p.protocol === 'https:' || p.protocol === 'http:') ? p.href : ''; } catch(e){ return ''; }
}

/* ---------- render ---------- */
function renderAll(){ renderFilter(); renderTrail(); renderSummary(); }

function renderFilter(){
  const sel = $('pill-filter');
  const names = state.categories.map(c => c.name);
  if (filterVal !== 'all' && !names.includes(filterVal)) filterVal = 'all';
  sel.replaceChildren(el('option',{value:'all',text:'All'}), ...names.map(n => el('option',{value:n,text:n})));
  sel.value = filterVal;
}

function renderSummary(){
  const total = state.items.length;
  const done = state.items.filter(i => i.done).length;
  const pct = total ? Math.round(done/total*100) : 0;
  $('done-count').textContent = done;
  $('total-count').textContent = total;
  $('pct-label').textContent = pct + '%';
  $('ring').style.setProperty('--pct', pct);
  $('footer-path').textContent = 'FY27 · ' + state.quarters.map(q => q.key).join(' → ');
}

function renderTrail(){
  const trail = $('trail');
  if (!loaded) return;
  const phases = [];
  state.quarters.forEach((q, qi) => {
    const all = state.items.filter(i => i.quarter === q.key);
    const visible = all.filter(i => filterVal === 'all' || i.category === filterVal);
    if (!editMode && filterVal !== 'all' && !visible.length) return;
    const qDone = all.filter(i => i.done).length;
    const qPct = all.length ? Math.round(qDone/all.length*100) : 0;
    const node = el('div',{class:'node'}, el('div',{class:'node-inner',text:q.key}));
    node.style.setProperty('--node-pct', qPct);
    node.style.setProperty('--node-color', qPct === 100 ? 'var(--green)' : 'var(--orange)');
    const conn = el('div',{class:'connector' + (all.length && qPct === 100 ? ' filled' : '')});
    const list = el('ul',{class:'checklist'});
    visible.forEach(item => list.append(editingId === item.id ? el('li',null,editForm(item, q.key)) : itemRow(item, all)));
    const body = el('div',{class:'phase-body'},
      el('div',{class:'phase-tag',text:'Quarter ' + (qi+1)}),
      el('h2',{class:'phase-title',text:q.label}),
      list);
    if (editMode) {
      if (editingId === 'new:' + q.key) body.append(el('div',{class:'add-row'}, editForm(null, q.key)));
      else body.append(el('div',{class:'add-row'}, el('button',{class:'btn',type:'button',text:'+ Add item to ' + q.key, onclick:() => { editingId = 'new:' + q.key; confirmDeleteId = null; renderTrail(); focusForm(); }})));
    } else if (!all.length) {
      list.append(el('li',{class:'empty',text:'No items this quarter.'}));
    }
    phases.push(el('div',{class:'phase'}, el('div',{class:'marker-col'}, node, conn), body));
  });
  if (!state.items.length && !editMode) {
    trail.replaceChildren(el('div',{class:'empty',text: canWrite ? 'No items yet. Select Edit list to add your first training item.' : 'No items yet.'}));
    return;
  }
  trail.replaceChildren(...phases);
}

function itemRow(item, quarterItems){
  const cb = el('input',{type:'checkbox', id:'cb-' + item.id, 'aria-label':'Mark complete: ' + item.title, disabled: !canWrite});
  cb.checked = item.done;
  cb.addEventListener('change', () => { item.done = cb.checked; renderTrail(); renderSummary(); queueSave(); });
  const url = safeUrl(item.url);
  const title = url ? el('a',{href:url,target:'_blank',rel:'noopener',text:item.title}) : document.createTextNode(item.title);
  const slot = catSlot(item.category);
  const tag = item.category ? el('span',{class:'tag',text:item.category}) : null;
  if (tag) { tag.style.background = 'var(--c' + slot + '-bg)'; tag.style.color = 'var(--c' + slot + '-fg)'; }
  const li = el('li',{class:'item' + (item.done ? ' checked' : '')}, cb,
    el('span',{class:'item-text'}, el('span',{class:'item-title'}, title), tag));
  if (editMode) {
    const pos = quarterItems.indexOf(item);
    const tools = el('div',{class:'item-tools'});
    if (confirmDeleteId === item.id) {
      tools.append(
        el('button',{class:'icon-btn danger',type:'button',text:'Delete',onclick:() => { state.items = state.items.filter(i => i.id !== item.id); pruneCategories(); confirmDeleteId = null; renderAll(); queueSave(); }}),
        el('button',{class:'icon-btn',type:'button',text:'Keep',onclick:() => { confirmDeleteId = null; renderTrail(); }}));
    } else {
      tools.append(
        el('button',{class:'icon-btn',type:'button',title:'Move up','aria-label':'Move up',text:'↑',disabled: pos === 0,onclick:() => moveItem(item, quarterItems, -1)}),
        el('button',{class:'icon-btn',type:'button',title:'Move down','aria-label':'Move down',text:'↓',disabled: pos === quarterItems.length - 1,onclick:() => moveItem(item, quarterItems, 1)}),
        el('button',{class:'icon-btn',type:'button',text:'Edit',onclick:() => { editingId = item.id; confirmDeleteId = null; renderTrail(); focusForm(); }}),
        el('button',{class:'icon-btn danger',type:'button',text:'Delete',onclick:() => { confirmDeleteId = item.id; renderTrail(); }}));
    }
    li.append(tools);
  }
  return li;
}

function moveItem(item, quarterItems, dir){
  const other = quarterItems[quarterItems.indexOf(item) + dir];
  if (!other) return;
  const a = state.items.indexOf(item), b = state.items.indexOf(other);
  state.items[a] = other; state.items[b] = item;
  renderTrail(); queueSave();
}

function editForm(item, quarterKey){
  const NEW = '__new__';
  const title = el('input',{type:'text',id:'f-title',value:item ? item.title : '',required:true});
  const url = el('input',{type:'url',id:'f-url',value:item ? item.url : '',placeholder:'https://…  (leave blank if none)'});
  const cat = el('select',{id:'f-cat'},
    el('option',{value:'',text:'(none)'}),
    ...state.categories.map(c => el('option',{value:c.name,text:c.name})),
    el('option',{value:NEW,text:'New category…'}));
  cat.value = item ? item.category : (state.categories[0] ? state.categories[0].name : '');
  const newCat = el('input',{type:'text',id:'f-newcat',placeholder:'Category name'});
  const newCatWrap = el('label',null,'New category name', newCat); newCatWrap.hidden = true;
  cat.addEventListener('change', () => { newCatWrap.hidden = cat.value !== NEW; if (!newCatWrap.hidden) newCat.focus(); });
  const qSel = el('select',{id:'f-quarter'}, ...state.quarters.map(q => el('option',{value:q.key,text:q.key + ' · ' + q.label})));
  qSel.value = item ? item.quarter : quarterKey;
  const err = el('div',{class:'err'}); err.hidden = true;
  const form = el('form',{class:'edit-form'},
    el('label',{class:'full'},'Title', title),
    el('label',{class:'full'},'Link', url),
    el('label',null,'Category', cat),
    el('label',null,'Quarter', qSel),
    newCatWrap, err,
    el('div',{class:'actions'},
      el('button',{class:'btn',type:'button',text:'Cancel',onclick:() => { editingId = null; renderTrail(); }}),
      el('button',{class:'btn primary',type:'submit',text:item ? 'Save changes' : 'Add item'})));
  form.addEventListener('submit', e => {
    e.preventDefault();
    const t = title.value.trim();
    const u = url.value.trim();
    let c = cat.value === NEW ? newCat.value.trim() : cat.value;
    if (!t) { err.textContent = 'Enter a title.'; err.hidden = false; title.focus(); return; }
    if (u && !safeUrl(u)) { err.textContent = 'Enter a full link that starts with https://, or leave it blank.'; err.hidden = false; url.focus(); return; }
    if (cat.value === NEW && !c) { err.textContent = 'Enter a name for the new category.'; err.hidden = false; newCat.focus(); return; }
    ensureCategory(c);
    if (item) {
      const moved = item.quarter !== qSel.value;
      Object.assign(item, {title:t, url:u, category:c, quarter:qSel.value});
      if (moved) { state.items = state.items.filter(i => i !== item); state.items.push(item); }
    } else {
      state.items.push({id:newId(), quarter:qSel.value, title:t, url:u, category:c, done:false});
    }
    pruneCategories();
    editingId = null; renderAll(); queueSave();
  });
  return form;
}
function focusForm(){ const t = $('f-title'); if (t) t.focus(); }

/* ---------- controls ---------- */
$('pill-filter').addEventListener('change', e => { filterVal = e.target.value; renderTrail(); });
$('edit-toggle').addEventListener('click', () => {
  editMode = !editMode; editingId = null; confirmDeleteId = null;
  $('edit-toggle').textContent = editMode ? 'Done editing' : 'Edit list';
  $('edit-toggle').classList.toggle('primary', editMode);
  renderTrail();
});
let resetArmed = null;
$('reset-btn').addEventListener('click', () => {
  const b = $('reset-btn');
  if (!resetArmed) {
    b.textContent = 'Select again to clear all checks'; b.classList.add('danger');
    resetArmed = setTimeout(() => { resetArmed = null; b.textContent = 'Reset progress'; b.classList.remove('danger'); }, 4000);
    return;
  }
  clearTimeout(resetArmed); resetArmed = null; b.textContent = 'Reset progress'; b.classList.remove('danger');
  state.items.forEach(i => { i.done = false; });
  renderAll(); queueSave();
});

/* ---------- storage ---------- */
const store = { mode:'starting', ref:null, timer:null, writing:false, again:false, dirty:false };
function setStatus(kind, text){
  const s = $('status'); s.dataset.kind = kind;
  s.textContent = text || {saving:'Saving', saved:'Saved to your account. Same on every computer.', local:'Saved in this browser only', starting:'Loading your plan', readonly:'View only'}[kind] || '';
}
function readLocal(){ try { const raw = localStorage.getItem(LOCAL_KEY); return raw ? JSON.parse(raw) : null; } catch(e){ return null; } }
function writeLocal(body){ try { localStorage.setItem(LOCAL_KEY, JSON.stringify(body)); } catch(e){} }
function queueSave(){
  if (store.mode === 'starting' || !canWrite) return;
  store.dirty = true; setStatus('saving');
  clearTimeout(store.timer); store.timer = setTimeout(flush, 600);
}
async function flush(){
  if (store.writing) { store.again = true; return; }
  store.writing = true;
  state.updated = new Date().toISOString();
  const body = JSON.parse(JSON.stringify(state));
  try {
    if (store.mode === 'db') {
      try { await store.ref.set(body); }
      catch(e){ if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 800 + Math.random()*800)); await store.ref.set(body); } else throw e; }
    } else writeLocal(body);
    if (!store.again) { store.dirty = false; setStatus(store.mode === 'db' ? 'saved' : 'local'); }
  } catch(e){
    if (e && e.code === 'invalid_argument') { canWrite = false; renderAll(); setStatus('readonly'); }
    else setStatus('error', 'Not saved: ' + (e && e.code === 'quota_exceeded' ? 'storage is full' : 'the save failed') + '. Reload and try again.');
  }
  store.writing = false;
  if (store.again) { store.again = false; flush(); }
}
function applyIncoming(d){ state = normalize(d); loaded = true; renderAll(); }

async function initStorage(){
  let db = null, user = null;
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    }
  } catch(e){ db = null; }
  if (user) { try { canWrite = await user.isOwner(); } catch(e){ canWrite = true; } }
  if (db) {
    try {
      const ref = db.doc(DOC_PATH);
      const snap = await ref.get();
      store.ref = ref; store.mode = 'db';
      applyIncoming(snap.exists ? snap.data() : null);
      setStatus(canWrite ? 'saved' : 'readonly');
      if (!canWrite) $('edit-toggle').hidden = true;
      ref.onSnapshot(s => {
        if (!s.exists || s.metadata.hasPendingWrites || store.dirty || store.writing || editingId) return;
        const d = s.data();
        if (d && d.updated && d.updated !== state.updated) applyIncoming(d);
      }, () => {});
      return;
    } catch(e){ store.ref = null; }
  }
  store.mode = 'local';
  applyIncoming(readLocal());
  setStatus('local');
}

renderSummary();
initStorage();
</script>
